name: Feature request
description: Propose a focused improvement to the aquarium or control room
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Describe the user-visible need rather than only the proposed implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Explain behavior, interaction, and relevant edge cases.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This can remain dependency-free at runtime.
        - label: This preserves Omarchy idle and lock behavior.
        - label: This can work across the supported terminal emulators.
